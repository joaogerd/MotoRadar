name: Testes e deploy do MotoRadar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motoradar-firebase-live
  cancel-in-progress: false

jobs:
  tests:
    name: Testar interface e rota
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de teste
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Executar testes
        run: pytest -q

  deploy:
    name: Publicar Firebase Hosting
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Verificar autenticação
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOTORADAR_7FBD3 }}
        run: |
          if [ -z "$FIREBASE_CREDENTIAL" ]; then
            echo "::error::Configure FIREBASE_SERVICE_ACCOUNT_MOTORADAR_7FBD3 em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Publicar no site existente
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOTORADAR_7FBD3 }}
          projectId: motoradar-7fbd3
          channelId: live
