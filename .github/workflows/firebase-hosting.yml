name: Testes e deploy do MotoRadar no Firebase

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motoradar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Testar interface, navegação e módulos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de teste
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Validar sintaxe JavaScript
        run: |
          for file in public/*.js; do node --check "$file"; done
      - name: Executar testes
        run: pytest -q

  deploy:
    name: Publicar Firebase Hosting (somente main)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Verificar autenticação
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOTORADAR_7FBD3 }}
        run: |
          if [ -z "$FIREBASE_CREDENTIAL" ]; then
            echo '::error::Credencial Firebase ausente.'
            exit 1
          fi
      - name: Publicar site estático
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOTORADAR_7FBD3 }}
          projectId: motoradar-7fbd3
          channelId: live

  preview:
    name: Prévia Firebase Hosting (develop)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Verificar autenticação
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOTORADAR_7FBD3 }}
        run: |
          if [ -z "$FIREBASE_CREDENTIAL" ]; then
            echo '::error::Credencial Firebase ausente.'
            exit 1
          fi
      - name: Publicar canal de prévia (não é produção)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOTORADAR_7FBD3 }}
          projectId: motoradar-7fbd3
          channelId: develop
          expires: 30d
